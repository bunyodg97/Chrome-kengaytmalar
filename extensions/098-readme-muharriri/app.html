<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><title>README Muharriri</title><link rel="icon" href="icons/32.png"><link rel="stylesheet" href="ui.css">
<style>html,body{height:100%}body{display:flex;flex-direction:column}.top{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}.top button,.top select{padding:5px 9px;font-size:13px}.split{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}#ed{border:0;border-right:1px solid var(--line);border-radius:0;resize:none;font:14px/1.6 var(--mono);padding:16px;height:100%;tab-size:2}
#pv{overflow:auto;padding:24px 32px;background:#fff;color:#1f2328}.md{font:16px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;max-width:880px;margin:0 auto}.md h1,.md h2{border-bottom:1px solid #d1d9e0;padding-bottom:.3em}.md h1{font-size:2em}.md h2{font-size:1.5em}.md h1,.md h2,.md h3{margin:24px 0 16px;font-weight:600;line-height:1.25}.md code{background:#818b981f;padding:.2em .4em;border-radius:6px;font:85% ui-monospace,monospace}.md pre{background:#f6f8fa;padding:16px;border-radius:6px;overflow:auto}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse}.md td,.md th{border:1px solid #d1d9e0;padding:6px 13px}.md tr:nth-child(2n){background:#f6f8fa}.md blockquote{border-left:.25em solid #d1d9e0;color:#59636e;margin:0;padding:0 1em}.md img{max-width:100%}.md a{color:#0969da;text-decoration:none}.md hr{border:0;height:.25em;background:#d1d9e0}.md ul.contains-task-list{list-style:none;padding-left:1.2em}.sep{width:1px;height:20px;background:var(--line)}
@media(max-width:900px){.split{grid-template-columns:1fr}#pv{display:none}}</style></head>
