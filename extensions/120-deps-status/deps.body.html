<div class="dp-grid">
  <aside class="stack">
    <div class="row"><input type="url" id="url" class="grow" data-i18n-ph="urlPh"><button class="btn ghost" id="fromUrl" data-i18n="fromUrl"></button></div>
    <textarea id="src" rows="18" data-i18n-ph="paste"></textarea>
    <div class="row"><button class="btn" id="check" data-i18n="check"></button>
      <label class="btn ghost"><span data-i18n="file"></span><input type="file" id="file" accept=".json,.txt" hidden></label></div>
    <p class="note" data-i18n="hint"></p>
  </aside>
  <section>
    <div class="row" style="margin-bottom:8px"><span id="sum" class="grow small"></span>
      <label class="check small"><input type="checkbox" id="only"><span data-i18n="onlyOutdated"></span></label>
      <button class="btn ghost small" id="cmd" data-i18n="copyCmd"></button><button class="btn ghost small" id="md" data-i18n="copyMd"></button></div>
    <table class="t"><thead><tr><th data-i18n="pkg"></th><th data-i18n="type"></th><th data-i18n="wanted"></th><th data-i18n="latest"></th><th data-i18n="status"></th></tr></thead><tbody id="rows"></tbody></table>
  </section>
</div>
<style>.dp-grid{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start}@media(max-width:900px){.dp-grid{grid-template-columns:1fr}}
#rows a{color:var(--fg);text-decoration:none;font-weight:600}#rows a:hover{text-decoration:underline}</style>
