<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 360px; font: 13.5px/1.45 "Segoe UI", system-ui, sans-serif; background: #f7f5fd; color: #1f1734; }
  button, input { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 4px; }
  header img { width: 24px; } header h1 { font-size: 15px; margin: 0; flex: 1; }
  header a { color: #7c3aed; font-size: 12.5px; cursor: pointer; text-decoration: none; }
  form { display: flex; gap: 6px; padding: 8px 14px; }
  input[type=search] { flex: 1; border: 2px solid #ddd3f7; border-radius: 12px; padding: 10px 12px; outline: none; font-size: 15px; background: #fff; }
  input[type=search]:focus { border-color: #7c3aed; }
  .go { border: 0; border-radius: 12px; padding: 0 14px; background: #7c3aed; color: #fff; font-weight: 700; cursor: pointer; font-size: 18px; }
  .hist { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 14px 6px; }
  .hist button { border: 0; background: #ece6fb; color: #5b3fb0; border-radius: 99px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
  h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: #786e95; margin: 8px 16px 6px; display: flex; justify-content: space-between; }
  h3 a { text-transform: none; letter-spacing: 0; color: #7c3aed; cursor: pointer; font-weight: 600; }
  .stores { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 14px 12px; }
  .st { display: flex; align-items: center; gap: 7px; background: #fff; border: 1.5px solid #e6e0f6; border-radius: 10px; padding: 7px 9px; cursor: pointer; user-select: none; }
  .st.on { border-color: #7c3aed; background: #f6f2ff; }
  .st img { width: 16px; height: 16px; }
  .st span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 12.5px; }
  .st i { font-style: normal; color: #7c3aed; font-weight: 800; }
  .tip { font-size: 11.5px; color: #8a82a3; padding: 0 16px 12px; line-height: 1.6; }
  kbd { background: #ece6fb; border-radius: 4px; padding: 0 5px; font-family: inherit; color: #5b3fb0; }
</style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><h1>Bir qidiruv — hamma do'kon</h1><a id="opts" title="Do'konlarni sozlash">⚙</a></header>
  <form id="f"><input type="search" id="q" placeholder="Masalan: Redmi Note 13" autofocus autocomplete="off"><button class="go" title="Qidirish">→</button></form>
  <div class="hist" id="hist"></div>
  <h3><span>Qayerdan qidiramiz?</span><a id="toggleAll">Hammasi</a></h3>
  <div class="stores" id="stores"></div>
  <div class="tip">💡 Manzil satrida: <kbd>d</kbd> + bo'sh joy + mahsulot nomi → Enter.<br>Saytda matnni belgilab, o'ng tugma → "do'konlardan qidirish".</div>
  <script src="stores.js"></script>
  <script src="popup.js"></script>
</body>
</html>
