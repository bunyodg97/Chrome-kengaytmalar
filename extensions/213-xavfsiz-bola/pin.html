<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Qulflangan — Xavfsiz Bola</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; }
  .card { width: 380px; padding: 32px 26px; }
</style>
</head>
<body>
  <div class="card pin-box">
    <div class="lock-ico">🔐</div>
    <h2>Bu sahifa qulflangan</h2>
    <div class="muted">Chrome kengaytmalari va sozlamalarini faqat ota-ona o'zgartira oladi. PIN kodni kiriting.</div>
    <input class="pin-input" id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" autofocus>
    <div class="err" id="err"></div>
    <button class="btn pri" id="go" style="width:100%">Ochish (5 daqiqaga)</button>
  </div>
  <script type="module" src="pin.js"></script>
</body>
</html>
