<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  body { width: 330px; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: linear-gradient(135deg, #5b5bd6, #7c66dc); color: #fff; }
  header img { width: 34px; height: 34px; }
  header small { opacity: .85; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 4px; }
  .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: var(--ok-soft); color: #0b7a6d; font-weight: 600; }
  .chip.off { background: #eef1f5; color: var(--muted); }
  .sec { padding: 8px 14px; }
  .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 6px 0 8px; }
  .item { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 7px; }
  .item .top { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }
  .item .top .v { font-weight: 500; color: var(--muted); font-size: 12.5px; }
  .item.blocked .top .v { color: var(--bad); }
  .bed { background: #eef0ff; border: 0; }
  footer { padding: 6px 14px 14px; }
  footer .btn { width: 100%; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 2px 8px; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div><h2 style="font-size:16px">Xavfsiz Bola</h2><small id="today"></small></div>
  </header>
  <div class="chips" id="chips"></div>
  <div class="sec" id="totalSec"></div>
  <div class="sec">
    <h3>Bugungi vaqt</h3>
    <div id="sites"></div>
  </div>
  <footer><button class="btn" id="parent">🔒 Ota-ona paneli</button></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
