<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
html,body{height:100%}
body{display:flex;flex-direction:column}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{padding:9px 11px;border-radius:10px;max-width:92%;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--acc);color:var(--acc-ink)}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.e{background:var(--bad-soft);color:var(--bad)}
.msg .tools{margin-top:6px;display:flex;gap:6px}
.msg .tools button{padding:3px 8px;font-size:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px 8px}
.quick button{font-size:12.5px;padding:6px}
form{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
form textarea{min-height:42px;max-height:140px;font-family:var(--f);font-size:13.5px}
</style></head>
<body data-about="float">
<header class="top"><img src="icons/32.png" alt=""><h1>AI Yordamchi</h1><button class="ghost" id="clear" title="Suhbatni tozalash">Tozalash</button><button class="ghost" id="opt">Sozlamalar</button></header>
<div id="chat"><div class="empty">Sahifa haqida savol bering yoki quyidagi tugmalardan birini bosing.<br>Matnni belgilab, o'ng tugma → «AI Yordamchi» ham ishlaydi.</div></div>
<div class="quick">
  <button class="ghost" data-q="sum">Sahifani qisqartirish</button>
  <button class="ghost" data-q="points">Asosiy fikrlar</button>
  <button class="ghost" data-q="tr">Sahifani tarjima</button>
  <button class="ghost" data-q="letter">Xat yozish</button>
</div>
<form id="f"><textarea id="in" placeholder="Savolingiz… (Enter — yuborish, Shift+Enter — yangi qator)"></textarea><button>Yuborish</button></form>
<script src="ru.js"></script><script src="about.js"></script><script src="util.js"></script><script src="ai.js"></script><script src="panel.js"></script>
</body></html>
