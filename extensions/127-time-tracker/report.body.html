<div class="row no-print" style="margin-bottom:10px">
  <label class="small" data-i18n="from"></label><input type="date" id="from" style="width:auto">
  <label class="small" data-i18n="to"></label><input type="date" id="to" style="width:auto">
  <select id="proj" style="width:auto"></select>
  <button class="btn ghost small" data-q="month" data-i18n="thisMonth"></button><button class="btn ghost small" data-q="last" data-i18n="lastMonth"></button>
  <span class="grow"></span>
  <button class="btn ghost small" id="csv" data-i18n="csv"></button><button class="btn small" id="inv" data-i18n="invoice"></button>
</div>
<div id="sum" class="stats no-print" style="margin-bottom:10px"></div>
<div class="no-print card" style="margin-bottom:10px">
  <form id="addE" class="row"><b data-i18n="addEntry"></b><select id="eP" style="width:auto"></select><input type="datetime-local" id="eS" style="width:auto"><input type="datetime-local" id="eE" style="width:auto"><input id="eN" data-i18n-ph="note" class="grow"><button class="btn small">+</button></form>
</div>
<table class="t no-print"><thead><tr><th data-i18n="project"></th><th data-i18n="start"></th><th data-i18n="end"></th><th class="num" data-i18n="dur"></th><th data-i18n="note"></th><th></th></tr></thead><tbody id="rows"></tbody></table>
<div id="invoice" class="hidden invoice">
  <div class="row no-print" style="margin-bottom:12px"><input id="provider" data-i18n-ph="providerPh"><input id="client" data-i18n-ph="clientPh"><input id="invNo" style="width:90px" value="1"><button class="btn" id="print" data-i18n="print"></button><button class="btn ghost" id="closeInv" data-i18n="close"></button></div>
  <div id="invBody"></div>
</div>
<style>
.invoice{background:#fff;color:#111;padding:36px;border:1px solid var(--line);border-radius:8px;max-width:820px;margin:0 auto}
.invoice h2{margin:0 0 4px;letter-spacing:2px}.invoice table{width:100%;border-collapse:collapse;margin-top:18px}
.invoice th,.invoice td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.invoice td.n,.invoice th.n{text-align:right}
.invoice .tot td{font-weight:700;border-top:2px solid #111}
.inv-head{display:flex;justify-content:space-between;gap:20px;margin-top:16px}
@media print{.no-print,.app-head{display:none!important}body{background:#fff}.invoice{border:0;padding:0}.pane{padding:0}}
#rows input{padding:2px 5px;font-size:12px}
.invoice .row input{width:auto;flex:1;min-width:120px}
</style>
