<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><title>Vaqt Hisobi — hisobot</title><link rel="icon" href="icons/32.png"><link rel="stylesheet" href="ui.css">
<style>.chart{display:flex;align-items:flex-end;gap:10px;height:200px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:pointer}
.col .b{width:100%;max-width:56px;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.col.sel .b{background:var(--warn)}
.col span{font-size:11.5px;color:var(--muted)}
.lbl{display:flex;gap:10px}.lbl div{flex:1;text-align:center;font-size:12px;color:var(--muted)}</style></head>
<body><div class="page">
<div class="row between"><h1>Vaqt Hisobi</h1><div class="row"><select id="range" style="width:auto"><option value="7">Oxirgi 7 kun</option><option value="14">14 kun</option><option value="30">30 kun</option></select><button class="ghost" id="csv">CSV yuklab olish</button><button class="danger" id="wipe">Tozalash</button></div></div>
<div class="grid2"><div class="card"><div class="muted small">Jami</div><div class="big" id="tot"></div></div><div class="card"><div class="muted small">Kunlik o'rtacha</div><div class="big" id="avg"></div></div></div>
<div class="card"><h2>Kunlar bo'yicha</h2><div class="chart" id="chart"></div><div class="lbl" id="lbl"></div><p class="muted small">Ustunni bossangiz, o'sha kunning saytlari chiqadi.</p></div>
<div class="card"><h2 id="sitesH">Saytlar</h2><div class="list" id="sites"></div></div>
</div>
<script src="ru.js"></script><script src="about.js"></script><script src="util.js"></script><script src="common.js"></script><script src="report.js"></script>
</body></html>
