<div class="stack">
  <div class="pv"><canvas id="cv"></canvas></div>
  <div class="small muted center" id="meta"></div>
  <div class="row"><div class="field grow"><label data-i18n="width"></label><input type="number" id="w" min="1" max="8000"></div>
    <button class="btn ghost small" id="swap" title="⇄" style="margin-top:12px">⇄</button>
    <div class="field grow"><label data-i18n="height"></label><input type="number" id="h" min="1" max="8000"></div></div>
  <div class="row"><div class="field"><label data-i18n="bg"></label><input type="color" id="bg"></div><div class="field"><label data-i18n="fg"></label><input type="color" id="fg"></div>
    <div class="field grow"><label data-i18n="style"></label><select id="st"><option value="solid" data-i18n="solid"></option><option value="gradient" data-i18n="gradient"></option><option value="checker" data-i18n="checker"></option></select></div>
    <button class="btn ghost small" id="rnd" data-i18n-title="random" style="margin-top:12px">🎲</button></div>
  <div class="field"><label data-i18n="text"></label><input id="tx"></div>
  <div class="field"><label data-i18n="presets"></label><div id="pre" class="row"></div></div>
  <div class="row"><div class="seg" id="fmt"><button data-f="png">PNG</button><button data-f="jpeg">JPG</button><button data-f="webp">WebP</button><button data-f="svg">SVG</button></div></div>
  <div class="row"><button class="btn" id="dl" data-i18n="download"></button><button class="btn ghost" id="cpImg" data-i18n="copyImg"></button><button class="btn ghost small" id="cpUrl" data-i18n="copyUrl"></button><button class="btn ghost small" id="cpTag" data-i18n="copyTag"></button></div>
</div>
<style>.pv{background:repeating-conic-gradient(var(--bg3) 0 25%,var(--bg2) 0 50%) 0/14px 14px;border-radius:8px;padding:8px;display:flex;justify-content:center;align-items:center;height:170px}
#cv{max-width:100%;max-height:154px;box-shadow:0 1px 4px rgba(0,0,0,.2)}#pre .btn{padding:2px 7px;font-size:11px}</style>
