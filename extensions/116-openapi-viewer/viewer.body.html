<div class="row" style="margin-bottom:8px">
  <input type="url" id="url" class="grow" data-i18n-ph="urlPh">
  <button class="btn" id="load" data-i18n="load"></button>
  <label class="btn ghost"><span data-i18n="file"></span><input type="file" id="file" accept=".json,.yaml,.yml" hidden></label>
  <button class="btn ghost" id="pasteBtn" data-i18n="paste"></button>
</div>
<div id="pasteBox" class="hidden stack" style="margin-bottom:10px"><textarea id="paste" rows="10"></textarea><button class="btn" id="renderPaste" data-i18n="render"></button></div>
<div id="doc"><div class="empty" data-i18n="empty"></div></div>
<style>
.oa-head h2{margin:0 0 4px;font-size:22px}.oa-head .desc{color:var(--fg2);white-space:pre-wrap;max-width:900px}
.oa-tools{position:sticky;top:46px;background:var(--bg);padding:8px 0;z-index:3;display:flex;gap:8px;align-items:center}
.oa-tag{margin-top:18px}.oa-tag>h3{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:4px;margin:0 0 8px}
.op{border:1px solid var(--line);border-radius:8px;margin-bottom:6px;overflow:hidden}
.op>summary{display:flex;align-items:center;gap:10px;padding:7px 10px;cursor:pointer;list-style:none}
.op>summary::-webkit-details-marker{display:none}
.m{font:700 11px var(--mono);color:#fff;padding:3px 0;border-radius:4px;width:62px;text-align:center;flex:none}
.m.get{background:#1c7ed6}.m.post{background:#2f9e44}.m.put{background:#e67700}.m.patch{background:#0ca678}.m.delete{background:#e03131}.m.head,.m.options,.m.trace{background:#868e96}
.op.get{border-color:color-mix(in srgb,#1c7ed6 40%,var(--line))}.op.post{border-color:color-mix(in srgb,#2f9e44 40%,var(--line))}.op.delete{border-color:color-mix(in srgb,#e03131 40%,var(--line))}
.op .p{font:600 13px var(--mono)}.op .s{color:var(--fg2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op.dep .p{text-decoration:line-through}
.op-b{padding:10px 12px;border-top:1px solid var(--line);background:var(--bg2)}
.op-b h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;color:var(--fg2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:900px){.cols{grid-template-columns:1fr}}
.sch{font:12px/1.55 var(--mono)}.sch .k{color:var(--accent)}.sch .ty{color:var(--fg2)}.sch .rq{color:var(--bad)}.sch .d{color:var(--fg2);font-family:system-ui;font-size:11px}
.sch details{margin-left:14px}.sch summary{margin-left:-14px;cursor:pointer}
.sch .row1{margin-left:14px}
.code{display:inline-block;font:600 12px var(--mono);padding:1px 6px;border-radius:4px;background:var(--bg3)}
.code.c2{color:var(--ok)}.code.c4,.code.c5{color:var(--bad)}.code.c3{color:var(--warn)}
</style>
