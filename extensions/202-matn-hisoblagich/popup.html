<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Matn Hisoblagich</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; width: 400px; font: 13.5px/1.45 "Segoe UI", system-ui, sans-serif; background: #fff8f2; color: #2b1a10; }
  body.win { width: auto; }
  button { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  header img { width: 24px; } header h1 { font-size: 15px; margin: 0; flex: 1; }
  textarea { display: block; width: calc(100% - 28px); margin: 0 14px; height: 120px; border: 1.5px solid #f3d9c4; border-radius: 12px; padding: 9px 11px; font: 13.5px/1.5 "Segoe UI", system-ui, sans-serif; resize: vertical; outline: none; background: #fff; }
  textarea:focus { border-color: #ea580c; }
  .acts { display: flex; gap: 6px; padding: 8px 14px; flex-wrap: wrap; }
  .b { border: 1px solid #f0d2bb; background: #fff; border-radius: 9px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
  .b:hover { border-color: #ea580c; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 14px; }
  .grid div { background: #fff; border: 1px solid #f6e3d4; border-radius: 10px; padding: 8px 6px; text-align: center; }
  .grid b { display: block; font-size: 19px; color: #c2410c; font-variant-numeric: tabular-nums; }
  .grid small { color: #8a6a55; font-size: 11.5px; }
  .card { margin: 8px 14px 0; background: #fff; border: 1px solid #f6e3d4; border-radius: 12px; padding: 10px 12px; }
  .sms { display: flex; align-items: center; gap: 12px; }
  .sms .n { font-size: 30px; font-weight: 800; color: #c2410c; line-height: 1; }
  .sms .d { flex: 1; font-size: 12.5px; color: #5c4535; }
  .warn { margin-top: 8px; background: #fff1e6; border-radius: 9px; padding: 8px 10px; font-size: 12.5px; color: #9a3412; }
  .warn code { background: #ffe1c8; padding: 0 5px; border-radius: 4px; font-size: 13px; }
  .warn .b { margin-top: 6px; background: #ea580c; border-color: #ea580c; color: #fff; }
  .ok { color: #15803d; }
  h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: #8a6a55; margin: 12px 16px 6px; }
  .lim { margin: 0 14px; background: #fff; border: 1px solid #f6e3d4; border-radius: 12px; padding: 6px 12px; }
  .l { padding: 5px 0; }
  .l .t { display: flex; justify-content: space-between; font-size: 12.5px; }
  .l .t span:last-child { font-variant-numeric: tabular-nums; color: #8a6a55; }
  .l .bar { height: 5px; background: #f6ebe2; border-radius: 99px; overflow: hidden; margin-top: 3px; }
  .l .bar i { display: block; height: 100%; background: #fb923c; border-radius: 99px; }
  .l.over .bar i { background: #dc2626; } .l.over .t span:last-child { color: #dc2626; font-weight: 700; }
  .tw { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 14px; }
  .tw span { background: #ffedd5; color: #9a3412; border-radius: 99px; padding: 2px 9px; font-size: 12px; }
  .foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; font-size: 12px; color: #8a6a55; }
  .foot label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .foot input { accent-color: #ea580c; }
</style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><h1>Matn Hisoblagich</h1></header>
  <textarea id="t" placeholder="Matnni shu yerga yozing yoki qo'ying (sahifada belgilangan matn avtomatik qo'yiladi)" autofocus></textarea>
  <div class="acts">
    <button class="b" id="paste">📋 Qo'yish</button>
    <button class="b" id="copy">Nusxa olish</button>
    <button class="b" id="clear">Tozalash</button>
  </div>
  <div class="grid">
    <div><b id="chars">0</b><small>belgi</small></div>
    <div><b id="noSpace">0</b><small>bo'sh joysiz</small></div>
    <div><b id="words">0</b><small>so'z</small></div>
    <div><b id="sentences">0</b><small>gap</small></div>
    <div><b id="paras">0</b><small>xatboshi</small></div>
    <div><b id="read">0</b><small>o'qish vaqti</small></div>
  </div>
  <div class="card">
    <div class="sms"><div class="n" id="smsN">0</div><div class="d" id="smsD">SMS</div></div>
    <div class="warn" id="warn" hidden></div>
  </div>
  <h3>Cheklovlar</h3>
  <div class="lim" id="lims"></div>
  <h3 id="twH" hidden>Ko'p takrorlangan so'zlar</h3>
  <div class="tw" id="tw"></div>
  <div class="foot"><span>🗣 Ovozda: <b id="speak">0</b></span><label><input type="checkbox" id="live"> Saytlardagi maydonlarda hisoblagich</label></div>
  <script src="count.js"></script>
  <script src="popup.js"></script>
</body>
</html>
