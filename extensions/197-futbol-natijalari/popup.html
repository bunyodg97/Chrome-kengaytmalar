<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <title>Futbol natijalari</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="22" height="22">
      <span id="appName">Futbol natijalari</span>
    </div>
    <div class="sports" id="sports" role="tablist"></div>
    <button class="icon-btn" id="btnSettings" title="Sozlamalar" aria-label="Sozlamalar">⚙</button>
  </header>

  <div class="search">
    <span class="search-ico">⌕</span>
    <input id="q" type="search" autocomplete="off" spellcheck="false">
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="home"></button>
    <button data-tab="live"></button>
    <button data-tab="fav"></button>
    <button data-tab="leagues"></button>
  </nav>

  <main id="main"></main>

  <script type="module" src="popup.js"></script>
</body>
</html>
