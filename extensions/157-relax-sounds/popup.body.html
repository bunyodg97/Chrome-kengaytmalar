<div class="stack">
  <div class="row">
    <button class="btn big-play" id="play"></button>
    <div class="field grow"><label data-i18n="master"></label><input type="range" id="master" min="0" max="100"></div>
  </div>
  <div class="field"><label data-i18n="presets"></label><div id="pre" class="row wrap"></div></div>
  <div class="field"><label data-i18n="sounds"></label><div id="grid" class="grid"></div></div>
  <div class="row">
    <div class="field grow"><label data-i18n="timer"></label><select id="tm"></select></div>
    <div class="small muted" id="left" style="margin-top:14px"></div>
  </div>
  <div class="row"><button class="btn ghost small" id="reset" data-i18n="resetAll"></button></div>
  <div class="small muted" data-i18n="hint"></div>
</div>
<style>
.wrap{flex-wrap:wrap;gap:5px}#pre .btn{padding:3px 9px;font-size:12px}
.big-play{min-width:104px;font-size:14px;padding:10px 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{border:1px solid var(--border,#d0d4dc);border-radius:10px;padding:7px 6px 6px;text-align:center;background:var(--bg2);transition:background .15s,border-color .15s}
.tile.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg2))}
.tile button{all:unset;cursor:pointer;display:block;width:100%}
.tile .ico{font-size:22px;line-height:1.3}.tile .nm{font-size:11px;display:block;min-height:26px;line-height:1.2}
.tile input[type=range]{width:100%;margin:2px 0 0}.tile:not(.on) input{opacity:.35}
</style>
