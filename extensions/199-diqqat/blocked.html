<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Diqqat vaqti</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #16132a; color: #f1effa; }
  .box { max-width: 520px; text-align: center; }
  .big { font-size: 64px; line-height: 1; margin-bottom: 14px; }
  h1 { font-size: 28px; margin-bottom: 6px; }
  .site { color: #a9a3c7; font-size: 15px; }
  .site b { color: #fff; }
  .left { margin: 26px auto 8px; font-size: 54px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .leftlbl { color: #8d87ad; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
  .quote { margin: 28px auto 0; max-width: 420px; color: #cfc6ff; font-size: 16px; font-style: italic; }
  .acts { margin-top: 30px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn.dark { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.1); color: #fff; }
  .link { background: none; border: 0; color: #7d77a0; cursor: pointer; font-size: 13px; text-decoration: underline; margin-top: 18px; }
  .link:disabled { cursor: default; text-decoration: none; }
</style>
</head>
<body data-about="none">
  <div class="box">
    <div class="big">🎯</div>
    <h1>Hozir diqqat vaqti</h1>
    <div class="site"><b id="host">Bu sayt</b> vaqtincha yopiq</div>
    <div class="leftlbl" style="margin-top:26px" id="leftLbl">Seans tugashiga</div>
    <div class="left" id="left">--:--</div>
    <div class="quote" id="quote"></div>
    <div class="acts">
      <button class="btn pri" id="back">← Ishga qaytish</button>
    </div>
    <button class="link" id="anyway">Baribir ochish kerak</button>
  </div>
  <script src="ru.js"></script><script src="about.js"></script><script type="module" src="blocked.js"></script>
</body>
</html>
