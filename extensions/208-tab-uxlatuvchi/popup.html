<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 360px; font: 13.5px/1.45 "Segoe UI", system-ui, sans-serif; background: #f5f6fb; color: #1e2030; }
  button, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; padding: 14px 16px 16px; }
  .top { display: flex; align-items: center; gap: 8px; }
  .top img { width: 24px; } .top h1 { font-size: 15px; margin: 0; flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; background: rgba(255,255,255,.14); border-radius: 12px; }
  .stats div { text-align: center; padding: 8px 4px; } .stats b { display: block; font-size: 18px; } .stats small { opacity: .85; font-size: 11px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 14px 4px; }
  .btn { border: 1px solid #dcdff0; background: #fff; border-radius: 10px; padding: 9px 8px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
  .btn.pri { background: #4f46e5; border-color: #4f46e5; color: #fff; }
  .btn:hover { filter: brightness(.97); }
  h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: #6b6f86; margin: 12px 16px 6px; }
  .list { max-height: 230px; overflow-y: auto; margin: 0 14px; background: #fff; border: 1px solid #e6e8f2; border-radius: 12px; }
  .t { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid #f0f1f7; }
  .t:first-child { border-top: 0; }
  .t img { width: 16px; height: 16px; flex: none; }
  .t .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t.sleep .nm { color: #8a8ea6; }
  .chip { font-size: 10.5px; padding: 1px 7px; border-radius: 99px; background: #eef0f8; color: #5b5f78; white-space: nowrap; }
  .chip.z { background: #ede9fe; color: #5b21b6; } .chip.a { background: #dcfce7; color: #166534; } .chip.k { background: #fef3c7; color: #92400e; }
  .zz { border: 0; background: none; cursor: pointer; font-size: 14px; opacity: .6; padding: 2px 4px; } .zz:hover { opacity: 1; }
  .set { margin: 0 14px 14px; background: #fff; border: 1px solid #e6e8f2; border-radius: 12px; padding: 4px 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #f0f1f7; }
  .row:first-child { border-top: 0; }
  select { border: 1px solid #dcdff0; border-radius: 8px; padding: 3px 6px; background: #fff; }
  textarea { width: 100%; height: 70px; border: 1px solid #dcdff0; border-radius: 8px; padding: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; resize: vertical; }
  .switch { position: relative; width: 36px; height: 21px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #cdd0e0; border-radius: 99px; transition: .2s; cursor: pointer; }
  .switch span::after { content: ''; position: absolute; width: 15px; height: 15px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: #4f46e5; }
  .switch input:checked + span::after { transform: translateX(15px); }
  .foot { text-align: center; font-size: 11px; color: #8a8ea6; padding-bottom: 12px; }
</style>
</head>
<body>
  <header>
    <div class="top"><img src="icons/icon32.png" alt=""><h1>Tab Uxlatuvchi</h1><label class="switch" title="Avtomatik uxlatish"><input type="checkbox" id="enabled"><span></span></label></div>
    <div class="stats">
      <div><b id="sTabs">0</b><small>ochiq tab</small></div>
      <div><b id="sSleep">0</b><small>uxlamoqda</small></div>
      <div><b id="sMb">0</b><small>MB tejaldi*</small></div>
    </div>
  </header>
  <div class="acts">
    <button class="btn pri" id="others">💤 Boshqa tablarni uxlatish</button>
    <button class="btn" id="all">Barcha oynalarda</button>
  </div>
  <h3>Tablar</h3>
  <div class="list" id="list"></div>
  <h3>Sozlamalar</h3>
  <div class="set">
    <div class="row"><span>Ishlatilmasa uxlatish</span>
      <select id="minutes"><option value="5">5 daqiqadan keyin</option><option value="15">15 daqiqadan keyin</option><option value="30">30 daqiqadan keyin</option><option value="60">1 soatdan keyin</option><option value="120">2 soatdan keyin</option><option value="240">4 soatdan keyin</option></select></div>
    <label class="row"><span>📌 Mahkamlangan tablarga tegmaslik</span><span class="switch"><input type="checkbox" data-k="skipPinned"><span></span></span></label>
    <label class="row"><span>🔊 Ovoz chiqayotgan tablarga tegmaslik</span><span class="switch"><input type="checkbox" data-k="skipAudible"><span></span></span></label>
    <label class="row"><span>✍️ Forma to'ldirilayotgan tablarga tegmaslik</span><span class="switch"><input type="checkbox" data-k="skipForms"><span></span></span></label>
    <label class="row"><span>Uxlagan tab nomiga 💤 qo'shish</span><span class="switch"><input type="checkbox" data-k="markTitle"><span></span></span></label>
    <div style="padding:8px 0;border-top:1px solid #f0f1f7"><div style="margin-bottom:5px">⭐ Hech qachon uxlatilmaydigan saytlar</div><textarea id="whitelist"></textarea></div>
  </div>
  <div class="foot">* taxminan, har bir tab ~70 MB · Tezkor tugma: Alt+Shift+S</div>
  <script src="popup.js"></script>
</body>
</html>
