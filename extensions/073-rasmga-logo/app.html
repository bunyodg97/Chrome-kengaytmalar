<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><title>Rasmga Logo</title><link rel="icon" href="icons/32.png"><link rel="stylesheet" href="ui.css">
<style>.lay{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}.side{position:sticky;top:12px}.pv{background:repeating-conic-gradient(#8881 0 25%,transparent 0 50%) 0 0/20px 20px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:center;align-items:center;min-height:360px;padding:8px}.pv canvas{max-width:100%;max-height:62vh}
.pos{display:grid;grid-template-columns:repeat(3,34px);gap:4px}.pos button{padding:0;height:30px}.pos button.on{background:var(--acc);color:var(--acc-ink)}.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.th div{position:relative}.th img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer}.th img.on{border-color:var(--acc)}.th span{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center;cursor:pointer}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}.drop.on{border-color:var(--acc);color:var(--acc)}.logo img{max-height:50px;max-width:140px;background:#8882;border-radius:4px}@media(max-width:860px){.lay{grid-template-columns:1fr}.side{position:static}}</style></head>
<body><div class="page" style="max-width:1300px"><div class="row between"><h1>Rasmga Logo</h1><span class="small muted" id="cnt"></span></div>
<div class="lay"><div class="side list">
<div class="card list"><b>1. Rasmlar</b><label class="drop" id="drop">Rasmlarni shu yerga tashlang yoki bosing<input type="file" id="imgs" accept="image/*" multiple hidden></label><div class="small muted">Ctrl+V bilan ham qo'yish mumkin</div></div>
<div class="card list"><b>2. Belgi</b><div class="tabs" id="mode"><button data-m="logo" class="on">Logo</button><button data-m="text">Matn</button></div>
<div id="mLogo" class="list"><div class="row logo"><label class="btn ghost">Logo tanlash<input type="file" id="logo" accept="image/*" hidden></label><img id="lp" hidden alt=""></div><label class="inline small"><input type="checkbox" id="white" style="width:auto"> Oq rangga aylantirish</label></div>
<div id="mText" class="list" hidden><input id="txt" value="© Do'konim.uz"><div class="grid2"><label>Rang<input type="color" id="col" value="#ffffff"></label><label class="inline small" style="margin-top:18px"><input type="checkbox" id="shadow" checked style="width:auto"> Soya</label></div></div></div>
<div class="card list"><b>3. Joylashuv</b><div class="row" style="align-items:flex-start"><div class="pos" id="pos"></div><div class="list grow"><label class="inline small"><input type="checkbox" id="tile" style="width:auto"> Takroriy naqsh (butun rasm bo'ylab)</label><label class="small">Burchak<input type="range" id="rot" min="-45" max="45" value="0"></label></div></div>
<label class="small">O'lcham: <span id="szv"></span>%<input type="range" id="sz" min="3" max="80" value="18"></label>
<label class="small">Shaffoflik: <span id="opv"></span>%<input type="range" id="op" min="5" max="100" value="70"></label>
<label class="small">Chetdan: <span id="mgv"></span>%<input type="range" id="mg" min="0" max="20" value="3"></label></div>
<div class="card list"><b>4. Saqlash</b><div class="grid2"><select id="fmt"><option value="same">Asl format</option><option value="jpeg">JPG</option><option value="png">PNG</option><option value="webp">WEBP</option></select><label class="small">Maks. eni (px)<input type="number" id="maxw" placeholder="o'zgarmasin"></label></div>
<label class="small">Fayl nomi qo'shimchasi<input id="suf" value="-logo"></label>
<div class="row"><button id="zip" style="flex:1">ZIP yuklab olish</button><button class="ghost" id="one">Shu rasmni</button></div><progress id="pg" value="0" hidden style="width:100%"></progress></div>
</div>
<div><div class="pv"><canvas id="cv"></canvas><div class="empty" id="ph">Rasm qo'shing — natija shu yerda ko'rinadi</div></div><div class="th" id="th"></div></div></div></div>
<script src="ru.js"></script><script src="about.js"></script><script src="util.js"></script><script src="lib/jszip.min.js"></script><script src="app.js"></script></body></html>
