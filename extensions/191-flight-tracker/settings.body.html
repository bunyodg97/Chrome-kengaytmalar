<div class="set-block">
  <div class="field"><label data-i18n="token"></label><input type="password" id="token" autocomplete="off" placeholder="…"></div>
  <p class="note" data-i18n="tokenNote"></p>
  <div class="row"><a class="btn ghost small" href="https://www.travelpayouts.com/" target="_blank" rel="noopener" data-i18n="getToken"></a></div>
  <div class="field" style="margin-top:8px"><label data-i18n="interval"></label><select id="interval"></select></div>
  <div class="field"><label data-i18n="defCurrency"></label><select id="defCur"><option value="usd">USD</option><option value="eur">EUR</option><option value="rub">RUB</option><option value="uzs">UZS</option><option value="kzt">KZT</option></select></div>
  <div class="field ac-wrap"><label data-i18n="home"></label><input id="home" autocomplete="off" data-i18n-ph="placePh"><div class="ac" id="acHome"></div></div>
  <p class="note" data-i18n="checkLimit"></p>
  <button class="btn" id="saveCfg" data-i18n="save"></button>
</div>
