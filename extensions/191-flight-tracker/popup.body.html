<div class="row" style="margin-bottom:8px"><div class="seg" id="sub"><button data-s="search" class="active" data-i18n="tabSearch"></button><button data-s="watch" id="subWatch"></button></div></div>
<div id="v-search" class="stack">
  <div class="row nowrap">
    <div class="field grow ac-wrap"><label data-i18n="from"></label><input id="from" autocomplete="off" data-i18n-ph="placePh"><div class="ac" id="acFrom"></div></div>
    <button class="btn ghost small" id="swap" style="margin-top:6px">⇄</button>
    <div class="field grow ac-wrap"><label data-i18n="to"></label><input id="to" autocomplete="off" data-i18n-ph="anywhere"><div class="ac" id="acTo"></div></div>
  </div>
  <div class="row nowrap">
    <div class="field grow"><label data-i18n="depart"></label><input type="date" id="dep"></div>
    <div class="field grow"><label data-i18n="ret"></label><input type="date" id="ret"></div>
  </div>
  <div class="row">
    <div class="seg" id="mode"><button data-m="month" class="active" data-i18n="byMonth"></button><button data-m="day" data-i18n="byDay"></button></div>
    <select id="cur"><option value="usd">USD</option><option value="eur">EUR</option><option value="rub">RUB</option><option value="uzs">UZS</option><option value="kzt">KZT</option></select>
    <label class="small" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="direct"><span data-i18n="direct"></span></label>
  </div>
  <button class="btn block" id="go" data-i18n="search"></button>
  <div id="res"></div>
</div>
<div id="v-watch" class="stack" hidden>
  <div class="row"><button class="btn small" id="chk" data-i18n="checkNow"></button><span class="small muted" id="chkInfo"></span></div>
  <div id="wl"></div>
</div>
