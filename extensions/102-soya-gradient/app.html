<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><title>Soya va Gradient</title><link rel="icon" href="icons/32.png"><link rel="stylesheet" href="ui.css">
<style>.lay{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}.stage{min-height:420px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);transition:background .2s}.box{width:220px;height:160px;border-radius:16px;background:#fff;display:grid;place-items:center;font:700 22px system-ui;color:#333}
.layer{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:4px}.layer.on{border-color:var(--acc)}.rw{display:grid;grid-template-columns:70px 1fr 46px;gap:6px;align-items:center;font-size:12px}.rw input[type=number]{padding:3px 4px}pre{background:#1e1f24;color:#e6e6e6;padding:12px;border-radius:8px;font:12.5px var(--mono);white-space:pre-wrap;word-break:break-all;margin:0}
.gbar{height:30px;border-radius:8px;position:relative;cursor:copy;border:1px solid var(--line)}.stop{position:absolute;top:-4px;width:14px;height:38px;margin-left:-7px;border:2px solid #fff;border-radius:5px;box-shadow:0 0 0 1px #0006;cursor:ew-resize}.stop.on{box-shadow:0 0 0 2px var(--acc)}.pre{display:flex;flex-wrap:wrap;gap:6px}.pre span{width:42px;height:42px;border-radius:8px;cursor:pointer;border:1px solid var(--line)}@media(max-width:900px){.lay{grid-template-columns:1fr}}</style></head>
<body><div class="page" style="max-width:1300px"><div class="row between"><h1>Soya va Gradient</h1><div class="tabs" id="tb"><button data-m="shadow" class="on">box-shadow</button><button data-m="text">text-shadow</button><button data-m="grad">Gradient</button></div></div>
<div class="lay"><div class="list" id="ctl"></div><div class="list"><div class="stage" id="stage"><div class="box" id="box">Namuna</div></div>
<div class="row"><label class="small">Fon <input type="color" id="sbg" value="#eef1f6" style="width:50px"></label><label class="small">Element <input type="color" id="ebg" value="#ffffff" style="width:50px"></label><label class="small">Radius <input type="range" id="rad" min="0" max="100" value="16" style="width:100px"></label></div>
<div class="row between"><b class="small">CSS</b><div class="row"><button class="ghost" id="cpC">CSS nusxa</button><button class="ghost" id="cpT">Tailwind nusxa</button></div></div><pre id="css"></pre><pre id="tw"></pre><b class="small">Namunalar</b><div class="pre" id="pre"></div></div></div></div>
<script src="ru.js"></script><script src="about.js"></script><script src="util.js"></script><script src="app.js"></script></body></html>
