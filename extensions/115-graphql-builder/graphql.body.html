<div class="gq-top row">
  <input type="url" id="url" class="grow" placeholder="https://api.example.com/graphql" list="hist">
  <datalist id="hist"></datalist>
  <button class="btn" id="load" data-i18n="load"></button>
  <span id="info" class="small muted"></span>
</div>
<details class="gq-headers"><summary class="small" data-i18n="headers"></summary>
  <textarea id="headers" rows="3" placeholder="Authorization: Bearer …"></textarea></details>
<div class="gq-grid">
  <section class="card gq-ex">
    <div class="row"><b class="grow" data-i18n="explorer"></b><input type="search" id="exq" data-i18n-ph="search" style="max-width:150px"></div>
    <div id="tree" class="tree"><div class="empty" data-i18n="noSchema"></div></div>
  </section>
  <section class="gq-ed">
    <div class="row"><b class="grow" data-i18n="query"></b><span class="small muted" data-i18n="acHint"></span>
      <button class="btn ghost small" id="pretty" data-i18n="prettify"></button><button class="btn ghost small" id="clearQ" data-i18n="clear"></button></div>
    <div class="ac-wrap"><textarea id="query" spellcheck="false" rows="16"></textarea><div id="ac" class="ac hidden"></div></div>
    <b data-i18n="variables"></b>
    <textarea id="vars" spellcheck="false" rows="5">{}</textarea>
    <button class="btn" id="run" data-i18n="run"></button>
  </section>
  <section class="gq-res">
    <div class="row"><b class="grow" data-i18n="result"></b><span id="time" class="small muted"></span><button class="btn ghost small" id="copyRes" data-i18n="copy"></button></div>
    <pre id="res" class="out"></pre>
  </section>
</div>
<style>
.gq-top{margin-bottom:8px}.gq-headers{margin-bottom:10px}
.gq-grid{display:grid;grid-template-columns:300px 1fr 1fr;gap:12px;align-items:start}
@media(max-width:1000px){.gq-grid{grid-template-columns:1fr}}
.gq-ex{max-height:calc(100vh - 150px);overflow:auto}
.gq-ed textarea,.gq-ed b{margin-bottom:6px;display:block}
#query{min-height:300px;font-size:13px;line-height:1.5}
#res{height:calc(100vh - 160px);min-height:200px}
.tree{font:12px/1.6 var(--mono)}
.node{white-space:nowrap}
.node>.lbl{display:flex;align-items:center;gap:4px;cursor:pointer;border-radius:4px;padding:0 3px}
.node>.lbl:hover{background:var(--bg3)}
.node .tw{width:12px;color:var(--fg2);display:inline-block;text-align:center}
.node .ty{color:var(--fg2)}.node .fn{color:var(--accent)}
.node .kids{margin-left:14px;border-left:1px dashed var(--line);padding-left:4px}
.node .args{margin:2px 0 4px 18px}
.node .args label{display:flex;gap:6px;align-items:center;margin:2px 0}
.node .args input,.node .args select{width:150px;padding:2px 5px;font:11px var(--mono)}
.root-h{font-weight:700;margin-top:6px;color:var(--fg2);font-family:system-ui}
.ac-wrap{position:relative}
.ac{position:absolute;z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.18);max-height:220px;overflow:auto;min-width:220px;font:12px var(--mono)}
.ac div{padding:3px 8px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.ac div.on,.ac div:hover{background:var(--accent);color:var(--accent-fg)}
.ac div span{opacity:.6}
</style>
