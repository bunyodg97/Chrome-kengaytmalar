<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 330px; font: 13.5px/1.45 "Segoe UI", system-ui, sans-serif; background: #fffaf0; color: #2b2410; }
  button { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
  header img { width: 24px; } header h1 { font-size: 15px; margin: 0; flex: 1; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 10px; }
  .btn { border: 1px solid #f1dfb0; background: #fff; border-radius: 10px; padding: 9px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
  .btn.pri { background: #f59e0b; border-color: #f59e0b; color: #fff; }
  h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: #8a7a52; margin: 4px 16px 6px; }
  .list { margin: 0 14px 12px; background: #fff; border: 1px solid #f1e4c2; border-radius: 12px; max-height: 300px; overflow-y: auto; }
  .it { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-top: 1px solid #faf1db; cursor: pointer; }
  .it:first-child { border-top: 0; }
  .it:hover { background: #fffbef; }
  .dot { width: 12px; height: 12px; border-radius: 3px; flex: none; margin-top: 3px; }
  .it .tx { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .empty { padding: 18px; text-align: center; color: #9a8a62; font-size: 13px; }
  .tip { font-size: 11.5px; color: #9a8a62; padding: 0 16px 12px; line-height: 1.6; }
</style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><h1>Stikerlar</h1></header>
  <div class="acts">
    <button class="btn pri" id="add">📝 Stiker qo'yish</button>
    <button class="btn" id="all">📚 Barcha eslatmalar</button>
  </div>
  <h3>Shu sahifada</h3>
  <div class="list" id="list"><div class="empty">Yuklanmoqda…</div></div>
  <div class="tip">💡 O'ng tugma → "Shu yerga stiker qo'yish" yoki matnni belgilab → "Marker bilan belgilash".<br>Tezkor: Alt+Shift+N — stiker, Alt+Shift+H — marker.</div>
  <script src="popup.js"></script>
</body>
</html>
