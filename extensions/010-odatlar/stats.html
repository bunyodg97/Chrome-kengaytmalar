<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><title>Odatlar — statistika</title><link rel="icon" href="icons/32.png"><link rel="stylesheet" href="ui.css">
<style>.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:var(--line)} .heat i.on{background:var(--c)} .heat i.off{opacity:.35} .heat i.today{outline:2px solid var(--ink)}
.hh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hh input[type=text]{width:auto;flex:1;font-weight:700}
.stat{display:flex;gap:16px;flex-wrap:wrap}.stat div{font-size:13px;color:var(--muted)}.stat b{display:block;font-size:20px;color:var(--ink)}</style></head>
<body><div class="page">
<div class="row between"><h1>Odatlar statistikasi</h1><div class="row"><label class="inline"><input type="checkbox" id="remOn"> Eslatma</label><input type="time" id="rem" style="width:auto"><button class="ghost" id="exp">Eksport (JSON)</button></div></div>
<div id="list" class="list"></div>
</div>
<script src="ru.js"></script><script src="about.js"></script><script src="util.js"></script><script src="common.js"></script><script src="stats.js"></script>
</body></html>
