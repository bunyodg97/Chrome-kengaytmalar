<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>body.popup{width:480px}.ck{border:1px solid var(--line);border-radius:8px;background:var(--card)}.ck>.h{display:flex;gap:8px;align-items:center;padding:7px 10px;cursor:pointer}
.ck>.h b{font-family:var(--mono);font-size:12.5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ck>.h .v{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck .f{padding:8px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}.ck .f[hidden]{display:none}.flags{display:flex;gap:12px;flex-wrap:wrap}</style></head>
<body class="popup"><header class="top"><img src="icons/32.png" alt=""><h1>Cookie Muharriri</h1><span class="chip acc" id="cnt"></span></header>
<div class="wrap">
  <div class="muted small" id="url" style="word-break:break-all"></div>
  <div class="row"><input id="q" placeholder="Nomi yoki qiymati bo'yicha qidirish" style="flex:1"><button id="add">+ Qo'shish</button></div>
  <div class="list" id="list" style="max-height:330px;overflow:auto"></div>
  <div class="row"><button class="ghost" id="exp">JSON</button><button class="ghost" id="net">Netscape</button><button class="ghost" id="hdr">Header sifatida</button><label class="btn ghost">Import<input type="file" id="imp" accept=".json" hidden></label><button class="danger" id="delAll">Hammasini o'chirish</button></div>
  <label class="inline small"><input type="checkbox" id="dec"> Qiymatlarni dekodlab ko'rsatish (URL-decode)</label>
</div>
<script src="ru.js"></script><script src="about.js"></script><script src="util.js"></script><script src="popup.js"></script></body></html>
