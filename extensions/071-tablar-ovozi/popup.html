<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>body.popup{width:400px}.t{display:grid;grid-template-columns:20px 1fr auto;gap:4px 8px;align-items:center}.t img{width:16px;height:16px}.t .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.t .n:hover{text-decoration:underline}.t .r{grid-column:2/4;display:flex;gap:6px;align-items:center}.t input[type=range]{flex:1}.t .p{width:38px;text-align:right;font-size:12px;color:var(--muted)}.t.cur{border-color:var(--acc)}.eq{display:inline-block;width:12px}</style></head>
<body class="popup"><div class="wrap">

<div class="row"><button class="ghost" id="muteAll" style="flex:1">🔇 Hammasini o'chirish</button><button class="ghost" id="unAll" style="flex:1">🔊 Hammasini yoqish</button></div>
<div class="list" id="list"></div><div class="small muted">Alt+Shift+M — faqat joriy tab ovozi qoladi. Ovoz balandligi sahifadagi audio/videoga qo'llanadi (100% dan baland qilish uchun «Ovoz Kuchaytirgich»).</div>
</div><script src="ru.js"></script><script src="about.js"></script><script src="util.js"></script><script src="popup.js"></script></body></html>
