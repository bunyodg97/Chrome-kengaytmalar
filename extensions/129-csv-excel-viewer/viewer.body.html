<div id="dropZone" class="drop">
  <div style="font-size:34px">📄</div>
  <b data-i18n="drop"></b>
  <label class="btn"><span data-i18n="choose"></span><input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden></label>
  <div class="small muted" data-i18n="formats"></div>
</div>
<div id="view" class="hidden">
  <div class="row" style="margin-bottom:8px">
    <b id="fname" class="mono"></b><span id="info" class="small muted"></span><span class="grow"></span>
    <span id="csvOpts" class="row">
      <label class="small" data-i18n="delim"></label><select id="delim" style="width:auto"><option value=",">,</option><option value=";">;</option><option value="&#9;">Tab</option><option value="|">|</option></select>
      <label class="small" data-i18n="encoding"></label><select id="enc" style="width:auto"><option value="utf-8">UTF-8</option><option value="windows-1251">Windows-1251</option></select>
    </span>
    <label class="check small"><input type="checkbox" id="hdr" checked><span data-i18n="header"></span></label>
    <input type="search" id="q" data-i18n-ph="search" style="width:200px">
    <button class="btn ghost small" id="exp" data-i18n="exportCsv"></button>
    <label class="btn small"><span data-i18n="choose"></span><input type="file" id="file2" accept=".csv,.tsv,.txt,.xlsx" hidden></label>
  </div>
  <div id="tabs" class="seg" style="margin-bottom:8px"></div>
  <div id="stats" class="card small hidden" style="margin-bottom:8px"></div>
  <div class="tbl-wrap"><table class="grid"><thead id="th"></thead><tbody id="tb"></tbody></table></div>
  <button class="btn ghost hidden" id="more" style="margin-top:8px"></button>
</div>
<style>
.drop{border:2px dashed var(--line);border-radius:14px;padding:60px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:30px}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 170px);border:1px solid var(--line);border-radius:8px}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.grid th{position:sticky;top:0;background:var(--bg2);cursor:pointer;user-select:none;text-align:left;z-index:1}
.grid th:hover{background:var(--bg3)}
.grid td.rn,.grid th.rn{position:sticky;left:0;background:var(--bg2);color:var(--fg2);text-align:right;font-size:11px;z-index:2}
.grid th.rn{z-index:3}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.grid tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
mark{background:#ffe066;color:#000}
</style>
