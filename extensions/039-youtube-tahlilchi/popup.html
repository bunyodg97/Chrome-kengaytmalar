<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>body.popup{width:440px}.sc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;border:5px solid var(--line);flex:none}
.tip{display:flex;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line)}.tip:last-child{border:0}.d{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}.d.ok{background:var(--ok)}.d.warn{background:var(--warn)}.d.bad{background:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tags span{font-size:11.5px;padding:2px 7px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.stats div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px}.stats b{display:block}.stats span{font-size:11px;color:var(--muted)}</style></head>
<body class="popup"><header class="top"><img src="icons/32.png" alt=""><h1>YouTube Tahlilchi</h1></header>
<div class="wrap" id="out"><div class="empty">YouTube videosini oching.</div></div>
<script src="ru.js"></script><script src="about.js"></script><script src="util.js"></script><script src="popup.js"></script></body></html>
