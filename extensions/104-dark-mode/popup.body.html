<div class="stack">
  <div class="card stack">
    <b data-i18n="emuTitle"></b>
    <div class="seg" id="emu">
      <button data-v="dark" data-i18n="dark"></button>
      <button data-v="light" data-i18n="light"></button>
      <button data-v="auto" data-i18n="auto"></button>
    </div>
    <p class="note" data-i18n="emuNote"></p>
  </div>
  <div class="card stack">
    <div class="row"><b class="grow" data-i18n="invTitle"></b>
      <label class="switch"><input type="checkbox" id="inv"><span></span></label></div>
    <div class="row"><span class="small muted" data-i18n="strength"></span>
      <input type="range" id="str" min="60" max="100" value="90" class="grow"></div>
    <p class="note" data-i18n="invNote"></p>
  </div>
  <p class="small muted" id="state"></p>
</div>
