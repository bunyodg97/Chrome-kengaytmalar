<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome kengaytmalari — Bunyodg97</title>
<meta name="description" content="Dasturchilar, traderlar va kundalik hayot uchun bepul Chrome kengaytmalari. Расширения Chrome для разработчиков, трейдеров и повседневной жизни.">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2127;--fg2:#5f6b7a;--line:#e3e6ea;--accent:#2f6fed;--radius:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#13161a;--card:#1b1f25;--fg:#e8ebef;--fg2:#9aa5b3;--line:#2a3039}}
:root[data-theme=dark]{--bg:#13161a;--card:#1b1f25;--fg:#e8ebef;--fg2:#9aa5b3;--line:#2a3039}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}.bar{display:flex;gap:12px;align-items:center;padding:12px 0;flex-wrap:wrap}
.bar h1{font-size:19px;margin:0;flex:1;min-width:200px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg2);padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}.seg button.on{background:var(--accent);color:#fff}
.hero{padding:34px 0 10px}.hero h2{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:var(--fg2);max-width:760px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 14px;align-items:center}
input[type=search]{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:5px 13px;font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card img{width:100%;aspect-ratio:8/5;object-fit:cover;display:block;background:var(--line);cursor:pointer}
.card .b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}.card h3{margin:0;font-size:16px;line-height:1.3}.card p{margin:0;color:var(--fg2);font-size:13.5px;flex:1}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fg2)}.dot{width:9px;height:9px;border-radius:50%}
.btns{display:flex;gap:8px;margin-top:6px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:14px;cursor:pointer;text-decoration:none!important}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.d{background:#e0245e;border-color:#e0245e;color:#fff}
.empty{padding:40px;text-align:center;color:var(--fg2)}
/* tafsilot */
#detail{display:none;padding:24px 0 60px}.back{display:inline-block;margin-bottom:14px;cursor:pointer;color:var(--accent)}
.dg{display:grid;grid-template-columns:1.25fr 1fr;gap:28px}@media(max-width:860px){.dg{grid-template-columns:1fr}}
.dg img{width:100%;border-radius:var(--radius);border:1px solid var(--line)}.dg h2{margin:0 0 8px;font-size:28px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:14px 0}.box h4{margin:0 0 8px}.box ul,.box ol{margin:0;padding-left:20px}.box li{margin:4px 0}
code{background:var(--line);padding:1px 6px;border-radius:5px;font-size:.9em}.tag{display:inline-block;background:var(--line);border-radius:6px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--fg2);font-size:14px;text-align:center}
</style>
</head>
<body>
<header><div class="wrap bar"><h1 id="ttl"></h1>
  <div class="seg" id="lang"><button data-l="uz">O’zbekcha</button><button data-l="ru">Русский</button></div>
  <a class="btn d" id="donate" target="_blank" rel="noopener"></a></div></header>
<main class="wrap">
  <div id="list">
    <div class="hero"><h2 id="h2"></h2><p id="sub"></p></div>
    <div class="tools"><input type="search" id="q"><a class="btn" id="gh" target="_blank" rel="noopener"></a><a class="btn p" id="rel" target="_blank" rel="noopener"></a></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="detail"></div>
</main>
<footer><div class="wrap"><span id="foot"></span> · <a id="dev" target="_blank" rel="noopener"></a></div></footer>
<script>
const D = /*DATA*/null;
const UI = {
  uz: {title:'Chrome kengaytmalari', h2:'Bepul Chrome kengaytmalari', sub:'Dasturchilar, traderlar va kundalik hayot uchun. Hammasi o’zbek va rus tilida, ma’lumotlaringiz faqat brauzeringizda qoladi.', search:'Kengaytma qidirish…', all:'Hammasi', more:'Batafsil', dl:'Yuklab olish', gh:'GitHub', rel:'Hamma zip’lar (Releases)', none:'Hech narsa topilmadi.', back:'← Hamma kengaytmalar', feats:'Imkoniyatlar', perms:'Ruxsatlar', inst:'O’rnatish', i1:'Zip faylni yuklab oling va doimiy papkaga oching (masalan <code>C:\\Kengaytmalar\\</code>). Keyin papkani ko’chirmang.', i2:'<code>chrome://extensions</code> sahifasini oching va <b>Developer mode</b>ni yoqing.', i3:'<b>Load unpacked</b> tugmasini bosib, ochilgan papkani tanlang.', ver:'Versiya', src:'Manba kodi', donate:'❤️ Qo’llab-quvvatlash', foot:'MIT litsenziya', dev:'Dasturchi', cat:'Kategoriya'},
  ru: {title:'Расширения Chrome', h2:'Бесплатные расширения Chrome', sub:'Для разработчиков, трейдеров и повседневной жизни. Всё на узбекском и русском, ваши данные остаются только в браузере.', search:'Поиск расширения…', all:'Все', more:'Подробнее', dl:'Скачать', gh:'GitHub', rel:'Все zip (Releases)', none:'Ничего не найдено.', back:'← Все расширения', feats:'Возможности', perms:'Разрешения', inst:'Установка', i1:'Скачайте zip и распакуйте в постоянную папку (например <code>C:\\Kengaytmalar\\</code>). Потом не перемещайте её.', i2:'Откройте <code>chrome://extensions</code> и включите <b>Developer mode</b>.', i3:'Нажмите <b>Load unpacked</b> и выберите распакованную папку.', ver:'Версия', src:'Исходный код', donate:'❤️ Поддержать', foot:'Лицензия MIT', dev:'Разработчик', cat:'Категория'}
};
const $ = s => document.querySelector(s);
let lang = (() => { try { const s = localStorage.getItem('lang'); if (s) return s; } catch (e) {} return /^ru/i.test(navigator.language) ? 'ru' : 'uz'; })();
let cat = 'all', q = '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const T = () => UI[lang];

function card(e) {
  const t = T();
  return `<article class="card"><a href="#/${e.id}"><img loading="lazy" src="${e.image[lang]}" alt="${esc(e.name[lang])}"></a>
  <div class="b"><div class="meta"><span class="dot" style="background:${e.color}"></span>${esc(D.categories[e.category][lang])} · v${e.version}</div>
  <h3>${esc(e.name[lang])}</h3><p>${esc(e.desc[lang])}</p>
  <div class="btns"><a class="btn" href="#/${e.id}">${t.more}</a><a class="btn p" href="${e.download}">${t.dl} ↓</a></div></div></article>`;
}
function renderList() {
  const t = T(), ql = q.trim().toLowerCase();
  const items = D.extensions.filter(e => (cat === 'all' || e.category === cat) && (!ql || (e.name.uz + e.name.ru + e.desc.uz + e.desc.ru + e.slug + e.id).toLowerCase().includes(ql)));
  $('#grid').innerHTML = items.length ? items.map(card).join('') : `<div class="empty">${t.none}</div>`;
  $('#chips').innerHTML = [['all', t.all, D.extensions.length], ...Object.entries(D.categories).map(([k, v]) => [k, v[lang], D.extensions.filter(e => e.category === k).length])]
    .map(([k, l, n]) => `<button class="chip ${k === cat ? 'on' : ''}" data-c="${k}">${esc(l)} (${n})</button>`).join('');
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = b.dataset.c; renderList(); });
}
function renderDetail(id) {
  const e = D.extensions.find(x => x.id == id), t = T(); if (!e) { location.hash = ''; return; }
  document.title = e.name[lang] + ' — ' + t.title;
  $('#detail').innerHTML = `<a class="back" href="#">${t.back}</a><div class="dg"><div><img src="${e.image[lang]}" alt="${esc(e.name[lang])}"></div>
  <div><h2>${esc(e.name[lang])}</h2><p>${esc(e.desc[lang])}</p>
  <p><span class="tag">${esc(D.categories[e.category][lang])}</span><span class="tag">${t.ver} ${e.version}</span><span class="tag">#${e.id}</span></p>
  <div class="btns"><a class="btn p" href="${e.download}">${t.dl} ↓</a><a class="btn" href="${e.source}" target="_blank" rel="noopener">${t.src}</a></div></div></div>
  <div class="dg"><div><div class="box"><h4>${t.feats}</h4><ul>${e.features[lang].map(f => `<li>${md(f)}</li>`).join('')}</ul></div></div>
  <div><div class="box"><h4>${t.inst}</h4><ol><li>${t.i1}</li><li>${t.i2}</li><li>${t.i3}</li></ol></div>
  <div class="box"><h4>${t.perms}</h4>${e.permissions.map(p => `<span class="tag">${esc(p)}</span>`).join('') || '—'}</div></div></div>`;
}
function route() {
  const m = location.hash.match(/^#\/(\d+)/);
  $('#list').style.display = m ? 'none' : ''; $('#detail').style.display = m ? 'block' : 'none';
  if (m) renderDetail(m[1]); else { document.title = T().title + ' — ' + D.developer; renderList(); }
  window.scrollTo(0, 0);
}
function ui() {
  const t = T(); document.documentElement.lang = lang;
  $('#ttl').textContent = '🧩 ' + t.title; $('#h2').textContent = t.h2; $('#sub').textContent = t.sub; $('#q').placeholder = t.search;
  $('#gh').textContent = t.gh + ' ↗'; $('#gh').href = D.repo; $('#rel').textContent = t.rel + ' ↗'; $('#rel').href = D.releases;
  $('#donate').textContent = t.donate; $('#donate').href = D.donate; $('#foot').textContent = t.foot; $('#dev').textContent = t.dev + ': ' + D.developer; $('#dev').href = D.site;
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
}
document.querySelectorAll('#lang button').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('lang', lang); } catch (e) {} ui(); route(); });
$('#q').oninput = e => { q = e.target.value; renderList(); };
window.onhashchange = route; ui(); route();
</script>
</body>
</html>
